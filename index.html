<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelio Bank — Online Banking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132A3A;
    --paper:#EFF3F1;
    --surface:#FFFFFF;
    --accent:#1E7F5C;
    --accent-dark:#155A41;
    --accent-warm:#C77D3B;
    --text:#16212B;
    --muted:#5B6B74;
    --line:#DEE4E1;
    --danger:#B3452C;
    --header-bg:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1A22;
      --surface:#16262F;
      --text:#E7EDEA;
      --muted:#93A5A2;
      --line:#243339;
      --header-bg:#0E1A22;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1A22;
    --surface:#16262F;
    --text:#E7EDEA;
    --muted:#93A5A2;
    --line:#243339;
    --header-bg:#0E1A22;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--text);
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;}
  a{cursor:pointer;}
  .icon{display:block;flex-shrink:0;}

  /* ---------- App shell ---------- */
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{
    height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--header-bg);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:32px;height:32px;border-radius:9px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:#EFF3F1;font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);}
  :root[data-theme="dark"] .brand .name, @media (prefers-color-scheme:dark){ .brand .name{color:var(--text);} }
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    background:none;border:none;color:var(--text);cursor:pointer;padding:8px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:var(--paper);}
  .avatar-btn{
    width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;border:none;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;cursor:pointer;
  }

  .layout{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:224px;flex-shrink:0;background:var(--ink);padding:18px 12px;
    display:flex;flex-direction:column;gap:2px;overflow-y:auto;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
    color:#B9CBC3;cursor:pointer;font-size:14px;font-weight:500;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.12);color:#fff;}

  .content{flex:1;overflow-y:auto;padding:30px 32px 50px;}
  .content-inner{max-width:800px;margin:0 auto;}

  .bottomnav{
    display:none;height:68px;flex-shrink:0;background:var(--surface);
    border-top:1px solid var(--line);align-items:center;justify-content:space-around;
  }
  .nav-btn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--muted);font-size:10.5px;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;
  }
  .nav-btn.active{color:var(--ink);font-weight:600;}
  :root[data-theme="dark"] .nav-btn.active{color:var(--text);}

  @media (max-width: 880px){
    .sidebar{display:none;}
    .bottomnav{display:flex;}
    .content{padding:18px 16px 26px;}
    .topbar{padding:0 16px;}
  }

  /* ---------- Auth / onboarding ---------- */
  .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .auth-card{width:100%;max-width:440px;}
  .onboard-hero{background:var(--ink);border-radius:24px;padding:26px 22px;color:#EFF3F1;margin-bottom:22px;}
  .onboard-hero .eyebrow{color:#9FC8B5;font-size:13px;margin-bottom:10px;}
  .onboard-hero h1{font-size:26px;line-height:1.25;color:#fff;}
  .step-dots{display:flex;gap:6px;margin:14px 0 22px 0;}
  .step-dots span{height:5px;flex:1;border-radius:3px;background:var(--line);}
  .step-dots span.active{background:var(--accent);}

  /* ---------- Form elements ---------- */
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px 0;}
  input[type=text],input[type=email],input[type=tel],input[type=password],select,textarea{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-family:'IBM Plex Sans',sans-serif;font-size:15px;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    display:block;width:100%;text-align:center;padding:14px 16px;border-radius:14px;
    background:var(--ink);color:#fff;font-weight:600;font-size:15px;border:none;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .btn:active{transform:scale(0.99);}
  .btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line);}
  .btn.accent{background:var(--accent);}
  .btn.danger{background:var(--surface);color:var(--danger);border:1px solid #E7C4B8;}
  .btn.small{padding:9px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-flex;}
  .btn.ghost{background:transparent;color:var(--text);text-decoration:underline;padding:8px;font-weight:500;}
  .btn-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .field-note{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .kyc-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border-radius:14px;margin-bottom:10px;border:1px solid var(--line);}
  .kyc-row .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .kyc-row.pending .dot{background:var(--accent-warm);}
  .avatar-init{
    width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
    justify-content:center;font-family:'Fraunces',serif;font-size:22px;margin:0 auto 10px auto;
  }

  /* ---------- Dashboard elements ---------- */
  .greet{font-size:13px;color:var(--muted);margin-bottom:2px;}
  .balance-card{
    background:linear-gradient(135deg,var(--ink) 0%, #1B4358 100%);
    border-radius:22px;padding:26px 24px;color:#fff;margin:16px 0 20px 0;
  }
  .balance-card .label{font-size:13px;color:#A9C9BC;margin-bottom:6px;}
  .balance-card .amount{font-family:'Fraunces',serif;font-size:38px;font-weight:600;}
  .balance-card .sub{font-size:12px;color:#B9D2C6;margin-top:8px;}

  .quick-actions{display:flex;justify-content:space-between;gap:8px;margin-bottom:26px;}
  .qa-btn{
    display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;
    font-family:'IBM Plex Sans',sans-serif;color:var(--text);cursor:pointer;font-size:12.5px;flex:1;
  }
  .qa-circle{
    width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--accent);
  }
  .qa-btn:hover .qa-circle{border-color:var(--accent);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px 0;}
  .section-title h3{font-size:16px;}
  .section-title a{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:2px;}

  .account-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .account-card .ac-left{display:flex;align-items:center;gap:12px;}
  .cur-badge{
    width:38px;height:38px;border-radius:11px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-weight:600;font-size:15px;color:var(--ink);flex-shrink:0;
  }
  :root[data-theme="dark"] .cur-badge{color:var(--text);}
  .account-card .ac-name{font-weight:600;font-size:14px;}
  .account-card .ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .account-card .ac-amt{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:15px;}

  .tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .tx-row:last-child{border-bottom:none;}
  .tx-icon{width:38px;height:38px;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);}
  :root[data-theme="dark"] .tx-icon{color:var(--text);}
  .tx-info{flex:1;min-width:0;}
  .tx-info .t1{font-size:14px;font-weight:600;}
  .tx-info .t2{font-size:12px;color:var(--muted);}
  .tx-amt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap;}
  .tx-amt.pos{color:var(--accent);}

  /* ---------- Cards ---------- */
  .card-visual{
    border-radius:18px;padding:20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#1E7F5C,#134A36);
  }
  .card-visual.frozen{background:linear-gradient(135deg,#7C8B93,#4B5960);}
  .card-visual .cv-top{display:flex;justify-content:space-between;font-size:12px;opacity:.85;}
  .card-visual .cv-num{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:2px;margin:22px 0 14px 0;}
  .card-visual .cv-bottom{display:flex;justify-content:space-between;font-size:11px;opacity:.85;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:12px;}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .tr-left{display:flex;align-items:center;gap:12px;min-width:0;color:var(--muted);}
  .toggle-row .tr-label{font-size:14px;font-weight:500;color:var(--text);}
  .toggle-row .tr-sub{font-size:12px;color:var(--muted);}
  .switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;border:none;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
  .switch.on .knob{left:21px;}
  .slider{width:100%;accent-color:var(--accent);}
  .row-chevron{color:var(--muted);display:flex;}

  .card-surface{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:14px;}
  .pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#E1F0E8;color:var(--accent-dark);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .qr-box{width:170px;height:170px;margin:16px auto;background:var(--surface);border-radius:12px;border:1px solid var(--line);
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);padding:12px;gap:3px;}
  .qr-box div{background:var(--ink);border-radius:1px;}
  :root[data-theme="dark"] .qr-box div{background:var(--text);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(19,42,58,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
  .modal-sheet{background:var(--paper);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 22px 28px 22px;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{font-size:19px;}
  .close{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:9px;display:flex;}
  .close:hover{background:var(--surface);}
  @media (min-width:640px){
    .modal-overlay{align-items:center;padding:24px;}
    .modal-sheet{border-radius:20px;max-height:82vh;}
  }

  .chat-bubble{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13.5px;margin-bottom:8px;}
  .chat-bubble.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
  .chat-bubble.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}

  .member-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .member-row:last-child{border-bottom:none;}
  .member-init{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0;}
  :root[data-theme="dark"] .member-init{color:var(--text);}
  .empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px;}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:12px;font-size:13.5px;text-align:center;z-index:300;box-shadow:0 10px 25px rgba(0,0,0,.3);max-width:90vw;}
  @media (max-width:880px){ .toast{bottom:84px;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= Icon system (inline SVG, professional line-icon style) ================= */
const ICONS = {

  sendArrow: '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="8 7 17 7 17 16"/>',

  exchange: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 4 21 9.5 15.5 9.5"/>',

  key: '<circle cx="8" cy="15" r="4"/><line x1="10.8" y1="12.2" x2="20" y2="3"/><line x1="15.5" y1="7.5" x2="18" y2="10"/><line x1="12.5" y1="10.5" x2="14.5" y2="12.5"/>',
  globe: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/>',
  tag: '<path d="M3 3h7l11 11-7 7L3 14V3Z"/><circle cx="7" cy="7" r="1.4"/>',
  paperclip: '<path d="M19.5 12L10 21.5a4 4 0 0 1-5.7-5.7L14 6.2a2.7 2.7 0 0 1 3.8 3.8L9 18.8a1.3 1.3 0 0 1-1.9-1.9l7.6-7.6"/>',
  coffee: '<path d="M4 8h13v6.5A4.5 4.5 0 0 1 12.5 19h-4A4.5 4.5 0 0 1 4 14.5V8Z"/><path d="M17 9.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/><line x1="7.3" y1="4.5" x2="7.3" y2="7"/><line x1="10.7" y1="4.5" x2="10.7" y2="7"/>',
  cart: '<circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.5 3H5L7.4 15.2A2 2 0 0 0 9.3 16.8H17.2A2 2 0 0 0 19.1 15.2L21 7H6"/>',
  trendUp: '<polyline points="4 15 10 9 14 13 20 6"/><polyline points="14 6 20 6 20 12"/>',
  landmark: '<polygon points="12,3 21,9 3,9"/><line x1="5" y1="9" x2="5" y2="18"/><line x1="9.5" y1="9" x2="9.5" y2="18"/><line x1="14.5" y1="9" x2="14.5" y2="18"/><line x1="19" y1="9" x2="19" y2="18"/><line x1="3" y1="21" x2="21" y2="21"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',

function ic(name, size){
  size = size || 20;
  return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
}

/* ================= State (in-memory only) ================= */
const state = {
  onboarded: false,
  step: 'welcome',
  nav: 'home',
  profile: { name:'', email:'', phone:'', plan:'Everyday', lang:'English', otp:true, notifs:true, kycStatus:'pending' },
  accounts: [
    { id:'a1', name:'Everyday Account', currency:'USD', number:'•••• 4471', balance: 8420.55, blocked:false },
    { id:'a2', name:'Euro Account', currency:'EUR', number:'•••• 2290', balance: 3110.00, blocked:false },
    { id:'a3', name:'Crypto Wallet', currency:'BTC', number:'•••• 90ab', balance: 0.1842, blocked:false, crypto:true },
  ],
  cards: [
    { id:'c1', label:'Aurelio Debit', number:'4218 •••• •••• 7742', exp:'09/29', frozen:false, limit:2500 },
  ],
  transactions: [
    { id:'t1', name:'Nordic Coffee Roasters', cat:'Food & Drink', amt:-6.40, date:'Today, 08:12' },
    { id:'t2', name:'Salary — Meridian Co.', cat:'Income', amt:3200.00, date:'Yesterday, 09:00' },
    { id:'t3', name:'Transfer to J. Alvarez', cat:'Transfer', amt:-150.00, date:'Yesterday, 17:44' },
    { id:'t4', name:'Fresco Market', cat:'Groceries', amt:-58.12, date:'Mon, 12:30' },
    { id:'t5', name:'Currency Exchange EUR→USD', cat:'Exchange', amt:-500.00, date:'Sun, 10:05' },
  ],
  templates: [
    { id:'r1', name:'Rent — Studio 4B', amt:900, freq:'Monthly, 1st' },
  ],
  corporate: null,
  chat: [ { from:'them', text:'Hi! This is Aurelio Support. How can I help today?' } ],
  ui: { modal:null, toast:null, activeAccount:null, activeTx:null }
};

function toast(msg){
  state.ui.toast = msg;
  render();
  setTimeout(()=>{ state.ui.toast=null; render(); }, 1800);
}

function qrBoxHtml(){
  let cells='';
  const seed=[1,0,1,1,0,1,0,1];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const on = (r*3+c*7+seed[(r+c)%8])%3===0;
    cells += `<div style="opacity:${on?1:0}"></div>`;
  }
  return `<div class="qr-box">${cells}</div>`;
}

  const usd = amt / rates[from];
  const converted = usd * rates[to];
  document.getElementById('ex_result').innerText = amt ? `≈ ${converted.toFixed(to==='BTC'?6:2)} ${to} at today's rate` : 'Enter an amount to see the converted total.';
}

/* ================= Chat modal ================= */
function modalChat(){
  return `<div class="modal-sheet">
    <div class="modal-head"><h3>Support chat</h3><button class="close" onclick="closeModal()">${ic('close',18)}</button></div>
    <div style="max-height:320px;overflow-y:auto;margin-bottom:12px;">
      ${state.chat.map(m=>`<div class="chat-bubble ${m.from==='me'?'me':'them'}">${m.text}</div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="chat_input" placeholder="Type a message…" style="flex:1;">
      <button class="btn small" onclick="sendChat()">Send</button>
    </div>
    <button class="btn ghost btn-row" style="width:100%;text-align:center;margin-top:8px;" onclick="toast('File attached (demo)')">${ic('paperclip',15)} Attach a file</button>
  </div>`;
}
function sendChat(){
  const input = document.getElementById('chat_input');
  if(!input.value.trim()) return;
  state.chat.push({from:'me', text: input.value.trim()});
  render();
  setTimeout(()=>{
    state.chat.push({from:'them', text:'Got it — a specialist will follow up shortly. Anything else I can help with?'});
    render();
  }, 700);
}

  <div class="grid2" style="margin-bottom:18px;">

/* ================= Corporate ================= */
function screenCorporate(){
  if(!state.corporate){
    return `
    <h2 style="font-size:21px;margin:0 0 4px 0;">Corporate accounts</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:18px;">Set up a business account and manage members with role‑based access.</p>
    <label>Company name</label>
    <input type="text" id="co_name" placeholder="e.g. Fieldstone Studio LLC">
    <label>Industry</label>
    <select id="co_industry"><option>Retail</option><option>Technology</option><option>Consulting</option><option>Hospitality</option></select>
    <button class="btn accent" style="margin-top:16px;" onclick="createCorporate()">Create corporate account</button>
    `;
  }
  const co = state.corporate;
  return `
  <h2 style="font-size:21px;margin:0 0 4px 0;">${co.name}</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${co.industry} · Corporate account</p>
  <div class="balance-card" style="margin-bottom:16px;">
    <div class="label">Business balance</div>
    <div class="amount" style="font-size:28px;">${fmt(co.balance)}</div>
  </div>
  <div class="section-title"><h3>Members</h3><a onclick="openAddMember()">${ic('plus',13)} Add member</a></div>
  <div class="card-surface">
    ${co.members.map((m,i)=>`<div class="member-row">
      <div class="member-init">${m.name.charAt(0)}</div>
      <div style="flex:1;"><div style="font-weight:600;font-size:14px;">${m.name}</div><div style="font-size:12px;color:var(--muted);">${m.role}</div></div>
      <button class="icon-btn" style="color:var(--danger);" onclick="removeMember(${i})">${ic('trash',16)}</button>
    </div>`).join('') || '<div class="empty">No members added yet.</div>'}
  </div>
  `;
}
function createCorporate(){
  const name = document.getElementById('co_name').value.trim();
  if(!name){ toast('Enter a company name'); return; }
  const industry = document.getElementById('co_industry').value;
  state.corporate = { name, industry, balance: 12500, members:[{name:state.profile.name||'You', role:'Owner'}] };
  render(); toast('Corporate account created');
}
function openAddMember(){ state.ui.modal='member'; render(); }
function modalMember(){
  return `<div class="modal-sheet">
    <div class="modal-head"><h3>Add team member</h3><button class="close" onclick="closeModal()">${ic('close',18)}</button></div>
    <label>Full name</label>
    <input type="text" id="mem_name" placeholder="e.g. Priya Nair">
    <label>Role</label>
    <select id="mem_role"><option>Admin</option><option>Bookkeeper</option><option>Viewer</option></select>
    <button class="btn accent" style="margin-top:16px;" onclick="addMember()">Add member</button>
  </div>`;
}
function addMember(){
  const name = document.getElementById('mem_name').value.trim();
  if(!name){ toast('Enter a name'); return; }
  const role = document.getElementById('mem_role').value;
  state.corporate.members.push({name, role});
  closeModal(); toast('Member added');
}
function removeMember(i){ state.corporate.members.splice(i,1); render(); }

  const p = state.profile;
  return `
  <h2 style="font-size:21px;margin:0 0 16px 0;">Profile &amp; settings</h2>
  <div style="text-align:center;margin-bottom:18px;">
    <div class="avatar-init">${(p.name||'A').charAt(0).toUpperCase()}</div>
    <div style="font-weight:600;">${p.name||'Sam Whitfield'}</div>
    <div style="font-size:12.5px;color:var(--muted);">${p.email||'sam@email.com'}</div>
    <span class="pill" style="margin-top:8px;">${p.kycStatus==='verified'?'KYC verified':'KYC pending'}</span>
  </div>
  <div class="card-surface">
    <div class="toggle-row" onclick="openModal('editProfile')" style="cursor:pointer;">

      <div class="row-chevron">${ic('chevron',16)}</div>

      <div class="row-chevron">${ic('chevron',16)}</div>
    </div>
    <div class="toggle-row" onclick="openModal('password')" style="cursor:pointer;">

    </div>
  </div>
  <div class="card-surface">

      </select>

    <div class="toggle-row">

      <select style="width:auto;padding:6px 10px;" onchange="setPlan(this.value)">

      </select>

  <button class="btn secondary btn-row" onclick="openModal('chat')">${ic('chat',17)} Contact customer support</button>
  `;
}
function toggleOtp(){ state.profile.otp=!state.profile.otp; render(); }
function toggleNotifs(){ state.profile.notifs=!state.profile.notifs; render(); }
function setLang(v){ state.profile.lang=v; toast('Language set to '+v); }
function setPlan(v){ state.profile.plan=v; toast('Pricing plan changed to '+v); }
function modalEditProfile(){
  const p = state.profile;
  return `<div class="modal-sheet">
    <div class="modal-head"><h3>Edit profile</h3><button class="close" onclick="closeModal()">${ic('close',18)}</button></div>
    <label>Full name</label><input type="text" id="ep_name" value="${p.name}">
    <label>Email</label><input type="email" id="ep_email" value="${p.email}">

  state.profile.name = document.getElementById('ep_name').value;

  state.profile.phone = document.getElementById('ep_phone').value;
  closeModal(); toast('Profile updated');
}

  const p = state.profile;
  return `<div class="modal-sheet">
    <div class="modal-head"><h3>Documents &amp; KYC</h3><button class="close" onclick="closeModal()">${ic('close',18)}</button></div>
    <div class="kyc-row"><div class="dot"></div><div><div style="font-weight:600;font-size:14px;">Government ID</div><div style="font-size:12px;color:var(--muted);">${p.kycStatus==='verified'?'Verified':'Pending'}</div></div></div>
    <div class="kyc-row"><div class="dot"></div><div><div style="font-weight:600;font-size:14px;">Proof of address</div><div style="font-size:12px;color:var(--muted);">${p.kycStatus==='verified'?'Verified':'Pending'}</div></div></div>

/* ================= Shell: header, sidebar, bottom nav, router ================= */
const NAV_ITEMS = [
  {id:'home', icon:'home', label:'Home'},
  {id:'accounts', icon:'cards', label:'Accounts & Cards'},
  {id:'transfers', icon:'transfer', label:'Transfers'},
  {id:'corporate', icon:'business', label:'Business'},
  {id:'profile', icon:'user', label:'Profile'},
];
function go(step){ state.step = step; render(); }
function nav(section){ state.nav = section; state.ui.modal=null; render(); }

function topbarHtml(){
  const initials = (state.profile.name||'A').trim().charAt(0).toUpperCase();
  return `<header class="topbar">
    <div class="brand"><div class="mark">A</div><div class="name">Aurelio Bank</div></div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="toast('No new notifications')" aria-label="Notifications">${ic('bell',19)}</button>
      <button class="avatar-btn" onclick="nav('profile')" aria-label="Profile">${initials}</button>
    </div>
  </header>`;
}
function sidebarHtml(){
  return `<nav class="sidebar">
    ${NAV_ITEMS.map(i=>`<div class="nav-item ${state.nav===i.id?'active':''}" onclick="nav('${i.id}')">${ic(i.icon,19)}<span>${i.label}</span></div>`).join('')}
  </nav>`;
}
function bottomNavHtml(){
  return `<nav class="bottomnav">
    ${NAV_ITEMS.map(i=>`<button class="nav-btn ${state.nav===i.id?'active':''}" onclick="nav('${i.id}')">${ic(i.icon,20)}<span>${i.label.split(' ')[0]}</span></button>`).join('')}
  </nav>`;
}
function modalHtml(){
  if(!state.ui.modal) return '';
  const map = {
    send: modalSend, request: modalRequest, exchange: modalExchange, topup: modalTopup,
    account: modalAccount, tx: modalTx, chat: modalChat, member: modalMember,
    editProfile: modalEditProfile, docs: modalDocs, password: modalPassword,
  };
  const fn = map[state.ui.modal];
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">${fn ? fn() : ''}</div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!state.onboarded){
    const inner = state.step==='welcome' ? screenWelcome()
      : state.step==='form' ? screenForm()
      : state.step==='kyc' ? screenKyc()
      : screenDone();
    app.innerHTML = `<div class="auth-shell"><div class="auth-card">${inner}</div></div>`;
    return;
  }
  const sectionMap = {
    home: screenHome, accounts: screenAccounts, transfers: screenTransfersHub,
    corporate: screenCorporate, profile: screenProfile, transactions: screenTransactions,
  };
  const body = (sectionMap[state.nav] || screenHome)();
  app.innerHTML = `
    ${topbarHtml()}
    <div class="layout">
      ${sidebarHtml()}
      <main class="content"><div class="content-inner">${body}</div></main>
    </div>
    ${bottomNavHtml()}
    ${modalHtml()}
    ${state.ui.toast?`<div class="toast">${state.ui.toast}</div>`:''}
  `;
}

render();
</script>
